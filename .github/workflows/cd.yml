name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Detect GitHub Pages support
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          available=false
          if [ "$status" = "200" ]; then
            available=true
          elif [ "$status" = "404" ]; then
            create=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
            if [ "$create" = "201" ] || [ "$create" = "409" ]; then
              available=true
            else
              echo "Pages site was not created (HTTP ${create})."
              cat /tmp/pages-create.json
            fi
          else
            echo "Pages site lookup returned HTTP ${status}."
            cat /tmp/pages.json
          fi

          echo "available=${available}" >> "$GITHUB_OUTPUT"
          if [ "$available" != "true" ]; then
            echo "GitHub Pages is not available for this repository. The site build succeeded and deploy is skipped."
          fi

      - name: Configure GitHub Pages
        if: steps.pages.outputs.available == 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        if: steps.pages.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
